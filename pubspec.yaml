name: lets_play
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.5.0
  internet_connection_checker_plus: ^2.5.0

  # Firebase (confirmed backend for the prototype)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Functional error handling
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Routing
  go_router: ^14.2.0
  flutter_svg: ^2.0.10

  # Letter pronunciation (quiz screens)
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: lets fonts_test.dart read pubspec.yaml and check that every
  # declared font asset actually exists.
  yaml: ^3.1.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.6.1
  flutter_native_splash: ^2.4.1

# Native (pre-Flutter-engine) splash screen: a plain brand-yellow background,
# no image. The animated splash.gif plays afterwards in SplashPage.
# Regenerate after changing the color with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FEDD05"
  android_12:
    color: "#FEDD05"
  web: false

flutter:

  uses-material-design: true
  assets:
    - assets/images/splash/
    - assets/images/intrto_icons/
    - assets/images/layout_icons/
    - assets/images/home/
    - assets/images/icons/
    - assets/images/profile/
    - assets/images/leaderboard/
    - assets/images/level3/

  # Gotham Rounded ships in two weights only. Flutter synthesises the rest,
  # so w500/w600 land on Book and w800/w900 on Bold.
  #
  # Gotham has no Arabic glyphs, so NotoSansArabic is declared right after it
  # and used as the fallback family — see AppTextStyles.fontFamilyFallback.
  fonts:
    - family: GothamRounded
      fonts:
        - asset: assets/font/GothamRnd/GothamRnd-Book.otf
          weight: 400
        - asset: assets/font/GothamRnd/GothamRnd-Bold.otf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Thin.ttf
          weight: 100
        - asset: assets/font/NotoSansArabic/NotoSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Light.ttf
          weight: 300
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/font/NotoSansArabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/font/NotoSansArabic/NotoSansArabic-ExtraBold.ttf
          weight: 800
        - asset: assets/font/NotoSansArabic/NotoSansArabic-Black.ttf
          weight: 900

